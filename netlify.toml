[build]
  publish = "public"
  # fix-en-links: English pages link to English pages in the built HTML (see the script).
  command = "hugo --gc --minify && node scripts/fix-en-links.mjs public"
  functions = "netlify/functions"

[functions]
  directory = "netlify/functions"

[build.environment]
  HUGO_VERSION = "0.139.0"

[context.production.environment]
  HUGO_ENV = "production"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# IndexNow ping to Bing & co. after each production deploy (netlify/plugins/indexnow).
[[plugins]]
  package = "/netlify/plugins/indexnow"
