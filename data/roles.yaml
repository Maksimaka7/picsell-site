roles:
  - slug: merchandiser
    seat: "Core + Vision"
    rate: 1400
    uk:
      name: "Мерчандайзер"
      tag: "Поле · полиця"
      title: "PICSELL для мерчандайзера — маршрут, фото полиці, звіт без паперу"
      description: "Маршрут на день, візит із гео-контролем, фото полиці з перевіркою якості кадру, ціни та Store Check. Працює без інтернету."
      lead: "Виходить на маршрут, заходить у точку, знімає полицю, фіксує ціни й наявність. Усе, що раніше йшло в зошит і месенджер, лягає в один звіт."
      day:
        - title: "Маршрут на день"
          text: "Точки на сьогодні з порядком обходу. Маршрут заданий по днях тижня."
        - title: "Візит у точці"
          text: "Старт і завершення візиту з радіусом гео-контролю — час і місце фіксуються."
        - title: "Фото полиці"
          text: "Застосунок перевіряє якість кадру одразу при зйомці й підказує перезняти."
        - title: "Звіт"
          text: "Ціни, наявність, Store Check і відповіді на опитувальник — одним пакетом."
      capabilities:
        - "Маршрут по днях тижня з порядком обходу точок"
        - "Старт і завершення візиту з радіусом гео-контролю"
        - "Мультифото з прив'язкою до контексту, фото до і після"
        - "Оцінка якості фото й валідація просто в момент зйомки"
        - "Регулярна й акційна ціна, наявність товару, фото цінника"
        - "Опитувальники по SKU, бренду та категорії, відповідь сканом коду"
        - "Store Check: обов'язковий асортимент, фейсинги, вторинні місця продажу, промо і POSM"
        - "Повний офлайн-режим — дані йдуть на сервер, коли з'явиться зв'язок"
      manager:
        - "Час і місце кожного візиту, а не слова про них"
        - "Фото з гео-міткою й часом — видно, що знято в точці, а не вдома"
        - "Модерація відповідей: прийняти або відхилити роботу"
        - "Персональний план на людину і факт його виконання"
      objections:
        - q: "У магазині немає зв'язку"
          a: "Застосунок повністю працює офлайн. Візит, фото й відповіді зберігаються на телефоні та йдуть на сервер, коли з'явиться мережа."
        - q: "Фотографуватимуть з дому"
          a: "Візит відкривається лише в радіусі точки, а кожен знімок несе гео-мітку й час зйомки."
        - q: "Люди довго вчитимуться"
          a: "Мерчандайзер бачить лише свій маршрут і свої задачі. Задачу можна створити просто в точці, без вебу."
    en:
      name: "Merchandiser"
      tag: "Field · shelf"
      title: "PICSELL for merchandisers — route, shelf photos, paperless reporting"
      description: "A route for the day, geo-verified visits, shelf photos with on-the-spot quality checks, prices and Store Check. Works offline."
      lead: "Walks the route, enters the store, shoots the shelf, records prices and availability. Everything that used to live in a notebook and a messenger ends up in one report."
      day:
        - title: "Route for the day"
          text: "Today's outlets in visiting order. The route is set per weekday."
        - title: "Visit in store"
          text: "Visit opens and closes inside a geo radius — time and place are recorded."
        - title: "Shelf photo"
          text: "The app checks image quality as the photo is taken and asks for a retake."
        - title: "Report"
          text: "Prices, availability, Store Check and survey answers in a single package."
      capabilities:
        - "Weekday route with a defined visiting order"
        - "Visit start and finish inside a geo-control radius"
        - "Multi-photo tied to context, before and after shots"
        - "Photo quality scoring and validation at the moment of capture"
        - "Regular and promo price, stock presence, price tag photo"
        - "Surveys by SKU, brand and category, answer by scanning a code"
        - "Store Check: must-stock list, facings, secondary placements, promo and POSM"
        - "Full offline mode — data syncs once a connection is back"
      manager:
        - "The time and place of every visit, not a claim about them"
        - "Geo-tagged, time-stamped photos — shot in store, not at home"
        - "Answer moderation: accept or reject the work"
        - "A personal plan per person and the actual delivery against it"
      objections:
        - q: "There is no signal in the store"
          a: "The app runs fully offline. Visits, photos and answers are stored on the phone and sync when the network returns."
        - q: "They will shoot photos from home"
          a: "A visit only opens inside the outlet's radius, and every shot carries a geo tag and capture time."
        - q: "Training will take too long"
          a: "A merchandiser only ever sees their own route and their own tasks. Tasks can be created in store, without the web app."

  - slug: sales-rep
    seat: "Core + Field"
    rate: 1400
    uk:
      name: "Торговий представник"
      tag: "Поле · клієнт"
      title: "PICSELL для торгового представника — замовлення, борги, наступна дія"
      description: "Каталог із цінами й залишками філіалу, замовлення офлайн, борги та оплати клієнта, черга нагадувань. Кабінет для самостійних замовлень."
      lead: "Веде клієнта в полі: замовлення, повернення, борг, оплата. І завжди бачить, що робити з цим клієнтом наступним кроком."
      day:
        - title: "Точка й контрагент"
          text: "Картка клієнта, його точки, контакти й позначка Red Flag, якщо є ризик."
        - title: "Замовлення"
          text: "Каталог із цінами та залишками філіалу. Повтор минулого замовлення в один дотик."
        - title: "Гроші"
          text: "Борг, історія оплат, індикація прострочки й планова дата платежу."
        - title: "Наступна дія"
          text: "Нагадування з тиром терміновості — щоб клієнт не випав із поля зору."
      capabilities:
        - "Створення замовлення, чернетки, повторне замовлення, робота офлайн"
        - "Каталог із товарними групами, цінами та залишками по філіалу"
        - "Пошук за штрихкодом, контроль термінів придатності"
        - "Борги клієнта, історія оплат, індикація прострочки, планова дата платежу"
        - "Повернення з причиною і статусами"
        - "Активності й нагадування з тирами терміновості та push на телефон"
        - "Кабінет контрагента: клієнт замовляє сам, бачить статус відвантаження й борг"
        - "HoReCa: картка закладу та алерти по лініях і меню"
      manager:
        - "Продажні цикли по контрагенту й персональний план на людину"
        - "Red Flag по клієнту — ризик видно до відвантаження"
        - "Блокування замовлення при простроченні"
        - "Історія замовлень і оплат у картці, без запитів у бухгалтерію"
      objections:
        - q: "У нас уже є 1С"
          a: "PICSELL не замінює облік. Він закриває поле — те, що відбувається до того, як документ потрапить у систему."
        - q: "Клієнти не замовлятимуть самі"
          a: "Кабінет не обов'язковий. Він знімає рутинні повтори з представника, а складні замовлення лишаються за ним."
        - q: "Представник не бачитиме борг вчасно"
          a: "Борг, прострочка й залишок коштів клієнта видно в його картці до створення замовлення."
    en:
      name: "Sales rep"
      tag: "Field · customer"
      title: "PICSELL for sales reps — orders, receivables, next action"
      description: "Catalogue with branch prices and stock, offline ordering, customer debt and payments, a queue of reminders. Self-service portal for customers."
      lead: "Runs the customer in the field: orders, returns, debt, payment. And always knows the next step for that account."
      day:
        - title: "Outlet and account"
          text: "Customer card, their outlets, contacts and a Red Flag if there is risk."
        - title: "Order"
          text: "Catalogue with branch prices and stock. Repeat the last order in one tap."
        - title: "Money"
          text: "Debt, payment history, overdue indicator and the planned payment date."
        - title: "Next action"
          text: "A reminder with an urgency tier, so the account does not fall off the radar."
      capabilities:
        - "Order creation, drafts, repeat orders, offline operation"
        - "Catalogue with product groups, branch prices and branch stock"
        - "Barcode search and shelf-life control"
        - "Customer debt, payment history, overdue indicator, planned payment date"
        - "Returns with reason codes and statuses"
        - "Activities and reminders with urgency tiers and phone push"
        - "Customer portal: the account orders itself, sees shipment status and debt"
        - "HoReCa: venue card and alerts on lines and menus"
      manager:
        - "Sales cycles per account and a personal plan per person"
        - "Red Flag on the customer — risk is visible before shipping"
        - "Order blocking on overdue balances"
        - "Order and payment history on the card, without asking finance"
      objections:
        - q: "We already run 1C"
          a: "PICSELL does not replace accounting. It covers the field — everything that happens before a document reaches your system."
        - q: "Customers will not order on their own"
          a: "The portal is optional. It takes routine repeat orders off the rep; complex orders stay with them."
        - q: "The rep will not see debt in time"
          a: "Debt, overdue status and the customer's remaining balance are on the card before an order is created."

  - slug: supervisor
    seat: "Core + Analytics"
    rate: 1000
    uk:
      name: "Супервайзер"
      tag: "Команда · контроль"
      title: "PICSELL для супервайзера — контроль польової команди без дзвінків"
      description: "Задачі на точку, мережу чи групу точок. Модерація фото й відповідей, AI-розпізнавання полиці, план-факт по маршруту, рейтинги."
      lead: "Ставить задачі команді й перевіряє, що вони справді виконані. Не за словами й скріншотами в чаті, а за фото з гео-міткою та планом-фактом."
      day:
        - title: "Задачі"
          text: "На конкретну точку, на всю мережу або на довільну групу магазинів."
        - title: "Перевірка"
          text: "Фото з гео й часом, авто-теги, знімки до і після. Приймає або відхиляє."
        - title: "Полиця"
          text: "AI розпізнає SKU, конкурентні позиції, цінники і зчитує ціну."
        - title: "План-факт"
          text: "Відхилення по маршруту й дашборд виконання плану по команді."
      capabilities:
        - "Задачі на точку, на мережу і на групу точок, з пріоритетом"
        - "Обов'язковість відповіді — без заповнених полів задача не закриється"
        - "Модерація: прийняти або відхилити роботу мерчандайзера"
        - "AI Vision: розпізнавання SKU, конкурентних SKU, цінників і ДМП, зчитування ціни"
        - "Фото з авто-тегами, гео й часом зйомки, знімки до і після"
        - "План і факт по маршруту, підтвердження візиту, відхилення"
        - "Відпустки й лікарняні в тому самому графіку"
        - "Рейтинги команди й виконання візитів, кабінет Power BI"
      manager:
        - "Дисципліна команди в цифрах, а не у відчуттях"
        - "Ескалації приходять адресно, а не в загальний чат"
        - "Збережені фільтри й погодження — регулярний контроль без ручної роботи"
        - "Рейтинг людей у команді на одному екрані"
      objections:
        - q: "Це стеження за людьми"
          a: "Фіксується робота, а не людина: факт візиту, фото й відповіді. Це той самий звіт, що й раніше, тільки без переписування вручну."
        - q: "У мене вже все в Excel"
          a: "Excel показує те, що в нього внесли. Тут дані потрапляють із поля автоматично, з гео й часом."
        - q: "Команда саботуватиме"
          a: "Мерчандайзер бачить лише свій маршрут — застосунок радше знімає з нього паперову роботу, ніж додає."
    en:
      name: "Supervisor"
      tag: "Team · control"
      title: "PICSELL for supervisors — field team control without phone calls"
      description: "Tasks per outlet, per chain or per group. Photo and answer moderation, AI shelf recognition, route plan-versus-fact, team ratings."
      lead: "Assigns work to the team and verifies it was actually done. Not from claims and chat screenshots, but from geo-tagged photos and plan-versus-fact."
      day:
        - title: "Tasks"
          text: "For one outlet, a whole chain, or any group of stores."
        - title: "Verification"
          text: "Geo-tagged, time-stamped photos, auto-tags, before and after. Accept or reject."
        - title: "Shelf"
          text: "AI recognises SKUs, competitor items and price tags, and reads the price."
        - title: "Plan vs fact"
          text: "Route deviations and a team plan-delivery dashboard."
      capabilities:
        - "Tasks per outlet, per chain and per group, with priority"
        - "Mandatory answers — a task will not close with empty required fields"
        - "Moderation: accept or reject a merchandiser's work"
        - "AI Vision: SKU, competitor SKU, price tag and display recognition, price reading"
        - "Photos with auto-tags, geo and capture time, before and after shots"
        - "Route plan versus fact, visit confirmation, deviations"
        - "Leave and sick days in the same schedule"
        - "Team ratings and visit delivery, Power BI workspace"
      manager:
        - "Team discipline as numbers, not as impressions"
        - "Escalations arrive to a named person, not to a group chat"
        - "Saved filters and approvals — routine control without manual work"
        - "Every person's rating on one screen"
      objections:
        - q: "This is surveillance"
          a: "What is recorded is the work, not the person: the visit, the photos, the answers. It is the same report as before, minus the retyping."
        - q: "We already have all this in Excel"
          a: "Excel shows what someone typed into it. Here the data arrives from the field automatically, with geo and time."
        - q: "The team will resist it"
          a: "A merchandiser only sees their own route — the app takes paperwork away rather than adding it."

  - slug: regional-manager
    seat: "Core + Analytics"
    rate: 1000
    uk:
      name: "Регіональний менеджер"
      tag: "Регіон · показники"
      title: "PICSELL для керівника регіону — покриття, наявність, ціни, конкуренти"
      description: "Power BI і гео-дашборди, наявність і OOS, відхилення від РРЦ, моніторинг цін конкурентів онлайн, HoReCa-покриття, план-факт по території."
      lead: "Тримає регіон за показниками: покриття, дисципліна, наявність, ціни й те, що робить конкурент. Рішення ухвалюються за даними, а не за звітами на словах."
      day:
        - title: "Ранковий дайджест"
          text: "Що впало, де прострочка, які ризики — до першої наради."
        - title: "Полиця й ціна"
          text: "Наявність і OOS, відхилення від РРЦ, аналітика Perfect Store по території."
        - title: "Конкуренти"
          text: "Ціни й наявність в онлайн-магазинах, новинки та зниклі товари."
        - title: "План-факт"
          text: "По маршрутах, по бренду, по SKU і фокусних позиціях, по території."
      capabilities:
        - "Кабінет Power BI і гео-дашборди по території"
        - "Наявність і OOS, цінова аналітика, аналітика Perfect Store"
        - "Відхилення від рекомендованої роздрібної ціни"
        - "Radar: ціни й наявність в онлайн-магазинах, новинки та зниклі товари конкурентів"
        - "HoReCa Intelligence: розбір меню, карта покриття, white spots, частка проти конкурентів"
        - "План-факт по маршруту, по продажах по бренду, по SKU і фокусних позиціях"
        - "Ліди: AI-оцінка, Red Flag, передача ліда в регіон"
        - "Масові активності з розподілом по часу й виконавцях"
      manager:
        - "Покриття території видно на карті, а не в зведеній таблиці"
        - "Ціна конкурента онлайн — без ручного обходу сайтів"
        - "White spots у HoReCa — де вас немає, а мали б бути"
        - "Один дайджест зранку замість обдзвону супервайзерів"
      objections:
        - q: "У нас уже є BI"
          a: "PICSELL віддає дані в Power BI. Питання не в тому, де малювати графіки, а в тому, звідки беруться цифри з поля."
        - q: "Дані з поля недостовірні"
          a: "Кожен факт має гео, час і фото. Саме тому їх можна класти в основу рішення."
        - q: "Це задорого для регіону"
          a: "Вартість рахується за місцями. Порахуйте свій склад команди в калькуляторі — цифра буде конкретна."
    en:
      name: "Regional manager"
      tag: "Region · metrics"
      title: "PICSELL for regional managers — coverage, availability, pricing, competitors"
      description: "Power BI and geo dashboards, availability and OOS, RRP deviation, online competitor price monitoring, HoReCa coverage, territory plan-versus-fact."
      lead: "Runs the region on metrics: coverage, discipline, availability, pricing, and what the competition is doing. Decisions come from data, not from verbal reports."
      day:
        - title: "Morning digest"
          text: "What dropped, where the overdue sits, which risks — before the first meeting."
        - title: "Shelf and price"
          text: "Availability and OOS, RRP deviation, Perfect Store analytics across the territory."
        - title: "Competitors"
          text: "Prices and availability in online stores, new arrivals and delisted items."
        - title: "Plan vs fact"
          text: "By route, by brand, by SKU and focus items, by territory."
      capabilities:
        - "Power BI workspace and geo dashboards across the territory"
        - "Availability and OOS, price analytics, Perfect Store analytics"
        - "Deviation from recommended retail price"
        - "Radar: competitor prices and availability online, new arrivals and delisted items"
        - "HoReCa Intelligence: menu breakdown, coverage map, white spots, share against competitors"
        - "Plan versus fact by route, by brand sales, by SKU and focus items"
        - "Leads: AI scoring, Red Flag, handover to the region"
        - "Bulk activities distributed across time and assignees"
      manager:
        - "Territory coverage on a map, not in a pivot table"
        - "Competitor pricing online, without manually walking sites"
        - "HoReCa white spots — where you are absent and should not be"
        - "One morning digest instead of calling every supervisor"
      objections:
        - q: "We already have BI"
          a: "PICSELL feeds Power BI. The question is not where the charts are drawn, but where the field numbers come from."
        - q: "Field data cannot be trusted"
          a: "Every fact carries geo, time and a photo. That is exactly why it can carry a decision."
        - q: "Too expensive for one region"
          a: "Pricing is per seat. Run your actual team through the calculator and the number will be concrete."
