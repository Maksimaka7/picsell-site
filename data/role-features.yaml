# Full capability map behind the /roles/ explorer.
# Live functionality only — this feeds a public page, not a roadmap.
# roles: M merchandiser · T sales-rep · S supervisor · R regional-manager
# key `name` is spelled out on purpose: a bare `n` is boolean false in YAML 1.1.
# Netlify is pinned to Hugo 0.139, whose YAML parser reads it that way, so
# `{ n: "..." }` silently became a false-keyed entry and every item name
# rendered as null in production — while a newer local Hugo parsed it fine.

