baseURL = "https://picsell.ai/"
title = "PICSELL — AI Vision і SFA для FMCG"
enableRobotsTXT = false
enableEmoji = true

defaultContentLanguage = "uk"
defaultContentLanguageInSubdir = false

[languages]
  [languages.uk]
    languageName = "Українська"
    languageCode = "uk"
    weight = 1
    title = "PICSELL — AI-платформа для FMCG"
    [languages.uk.params]
      description = "Vision AI + SFA + HoReCa Intelligence для виробників і дистриб'юторів FMCG"
      seoTitle = "PICSELL — AI Vision і SFA для FMCG | Контроль полиці і польові продажі"
      seoDescription = "AI-платформа для FMCG: розпізнавання полиці, автоматизація польових продажів і HoReCa-аналітика. OOS-детекція, Share of Shelf, Perfect Store. Замовте демо."
  [languages.en]
    languageName = "English"
    languageCode = "en"
    weight = 2
    title = "PICSELL — AI Platform for FMCG"
    [languages.en.params]
      description = "Vision AI + SFA + HoReCa Intelligence for FMCG brands and distributors"
      seoTitle = "PICSELL — AI Shelf Recognition & SFA Platform for FMCG | Vision AI, OOS Detection"
      seoDescription = "PICSELL: AI shelf recognition platform for FMCG brands and distributors. Vision AI detects OOS, tracks Share of Shelf and Perfect Store compliance. SFA + HoReCa Intelligence."

[params]
  domain = "picsell.ai"
  email = "info@picsell.ai"
  ogImage = "/images/og-default.png"

[permalinks]
  [permalinks.page]
    blog = "/blog/:slug/"
  [permalinks.section]
    blog = "/blog/"

[sitemap]
  changefreq = "weekly"
  priority = 0.5

[outputFormats]
  [outputFormats.redirects]
    baseName = "_redirects"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "redirects"]

[taxonomies]
