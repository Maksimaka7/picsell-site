<style>

:root{--bg0:#060608;--bg1:#0D0D0F;--bg2:#111114;--bg3:#1A1A1E;--border:#1E1E24;--blue:#0057FF;--blue2:#0066FF;--blue3:#3380FF;--neon:#C8FF00;--red:#FF003D;--orange:#FF5C00;--t1:#FFFFFF;--t2:#A0A0B0;--t3:#50505A;--s2:16px;--s3:24px;--s4:32px;--s5:48px;--s6:64px;--s7:96px;--r2:8px;--r3:12px;--r4:16px;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased;}
body{background:var(--bg1);color:var(--t1);font-family:'Inter',sans-serif;font-size:17px;line-height:1.7;overflow-x:hidden;}
a{text-decoration:none;color:var(--blue3);}a:hover{color:var(--t1);}
#header{position:fixed;top:0;left:0;right:0;z-index:1000;background:rgba(8,8,10,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);transition:all .3s;}
.header-inner{display:flex;align-items:center;justify-content:space-between;height:68px;max-width:1240px;margin:0 auto;padding:0 var(--s3);}
.logo{font-family:'Geologica',sans-serif;font-weight:900;font-size:20px;letter-spacing:-.03em;color:var(--t1);}.logo-plus{color:var(--neon);}
.nav-links{display:flex;gap:var(--s3);}
.nav-links a{font-size:14px;font-weight:500;color:var(--t2);transition:color .2s;}.nav-links a:hover{color:var(--t1);}
.btn-demo{display:inline-flex;align-items:center;gap:6px;background:var(--blue);color:#fff;font-family:'Geologica',sans-serif;font-weight:600;font-size:13px;padding:9px 18px;border-radius:var(--r2);transition:all .25s;}
.btn-demo:hover{background:var(--blue2);color:#fff;transform:translateY(-1px);}
.mob-nav-toggle{display:none;background:none;border:none;cursor:pointer;color:var(--t1);font-size:20px;}
.article-wrap{max-width:780px;margin:0 auto;padding:0 var(--s3);}
.sidebar-wrap{max-width:1140px;margin:0 auto;padding:0 var(--s3);display:grid;grid-template-columns:1fr 300px;gap:var(--s6);}
.article-hero{padding:120px 0 var(--s6);background:var(--bg0);position:relative;overflow:hidden;}
.art-hero-bg{position:absolute;inset:0;pointer-events:none;}
.dot-grid{position:absolute;inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.045) 1px,transparent 1px);background-size:30px 30px;}
.glow{position:absolute;top:-20%;left:50%;transform:translateX(-50%);width:700px;height:500px;background:radial-gradient(ellipse,rgba(0,87,255,.14) 0%,transparent 65%);filter:blur(50px);}
.hero-inner{position:relative;z-index:2;}
.breadcrumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--t3);margin-bottom:var(--s3);}
.breadcrumb a{color:var(--blue3);}.breadcrumb span{color:var(--t3);}
.art-category{display:inline-flex;align-items:center;font-family:'Orbitron',sans-serif;font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;background:rgba(0,87,255,.1);color:var(--blue3);padding:4px 12px;border-radius:999px;border:1px solid rgba(0,87,255,.25);margin-bottom:var(--s3);}
.art-title{font-family:'Geologica',sans-serif;font-size:clamp(30px,4vw,48px);font-weight:900;line-height:1.08;letter-spacing:-.02em;margin-bottom:var(--s3);color:var(--t1);}
.art-lead{font-size:19px;color:var(--t2);line-height:1.65;margin-bottom:var(--s4);max-width:680px;}
.art-meta{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;}
.art-meta-item{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--t3);}
.art-meta-dot{width:4px;height:4px;background:var(--border);border-radius:50%;}
.article-section{padding:var(--s7) 0;background:var(--bg1);}
.article-body{font-size:17px;line-height:1.8;color:var(--t2);}
.article-body h2{font-family:'Geologica',sans-serif;font-weight:800;font-size:clamp(22px,3vw,30px);color:var(--t1);margin:var(--s6) 0 var(--s3);letter-spacing:-.02em;padding-top:var(--s2);border-top:1px solid var(--border);}
.article-body h2:first-child{border-top:none;margin-top:0;}
.article-body h3{font-family:'Geologica',sans-serif;font-weight:700;font-size:20px;color:var(--t1);margin:var(--s4) 0 var(--s2);}
.article-body p{margin-bottom:var(--s3);color:var(--t2);}
.article-body strong{color:var(--t1);}
.article-body em{font-style:italic;color:var(--t2);}
.key-number{background:linear-gradient(135deg,rgba(0,87,255,.08),rgba(0,180,255,.04));border:1px solid rgba(0,87,255,.2);border-radius:var(--r3);padding:var(--s4);margin:var(--s4) 0;display:flex;align-items:flex-start;gap:var(--s3);}
.kn-val{font-family:'Geologica',sans-serif;font-weight:900;font-size:48px;color:var(--neon);line-height:1;flex-shrink:0;}
.kn-text h4{font-family:'Geologica',sans-serif;font-weight:700;font-size:17px;color:var(--t1);margin-bottom:4px;}
.kn-text p{font-size:14px;color:var(--t2);line-height:1.6;margin:0;}
.warn-box{background:rgba(255,0,61,.04);border:1px solid rgba(255,0,61,.15);border-left:3px solid var(--red);border-radius:var(--r3);padding:var(--s3) var(--s4);margin:var(--s3) 0;}
.warn-box .warn-title{font-family:'Geologica',sans-serif;font-weight:700;font-size:15px;color:var(--red);margin-bottom:8px;}
.warn-box p{font-size:15px;color:var(--t2);margin:0;}
.good-box{background:rgba(200,255,0,.04);border:1px solid rgba(200,255,0,.15);border-left:3px solid var(--neon);border-radius:var(--r3);padding:var(--s3) var(--s4);margin:var(--s3) 0;}
.good-box .good-title{font-family:'Geologica',sans-serif;font-weight:700;font-size:15px;color:var(--neon);margin-bottom:8px;}
.good-box p{font-size:15px;color:var(--t2);margin:0;}
.checklist{display:flex;flex-direction:column;gap:10px;margin:var(--s3) 0;}
.cl-item{display:flex;align-items:flex-start;gap:12px;padding:12px var(--s3);background:var(--bg3);border:1px solid var(--border);border-radius:var(--r2);}
.cl-icon{font-size:16px;flex-shrink:0;margin-top:2px;}
.cl-text{font-size:15px;color:var(--t2);line-height:1.6;}
.cl-text strong{color:var(--t1);}
.sign-bad .cl-icon{color:var(--red);}
.sign-good .cl-icon{color:var(--neon);}
.comparison-table{width:100%;border-collapse:collapse;margin:var(--s4) 0;border-radius:var(--r3);overflow:hidden;}
.comparison-table th{font-family:'Orbitron',sans-serif;font-size:9px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);padding:12px 18px;text-align:left;border-bottom:1px solid var(--border);background:var(--bg2);}
.comparison-table td{padding:13px 18px;border-bottom:1px solid rgba(30,30,36,.7);font-size:14px;color:var(--t2);}
.comparison-table td:first-child{font-weight:600;color:var(--t1);}
.comparison-table tr:last-child td{border-bottom:none;}
.comparison-table .bad{color:var(--red);}.comparison-table .good{color:var(--neon);}
.quote-pull{font-family:'Geologica',sans-serif;font-size:22px;font-weight:700;line-height:1.4;color:var(--t1);border-left:3px solid var(--blue);padding:var(--s3) var(--s4);margin:var(--s5) 0;background:var(--bg3);border-radius:0 var(--r3) var(--r3) 0;}
.formula-box{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r3);padding:var(--s4);margin:var(--s4) 0;text-align:center;}
.formula-box .formula{font-family:'Geologica',sans-serif;font-size:20px;font-weight:700;color:var(--neon);margin-bottom:8px;}
.formula-box .formula-note{font-size:13px;color:var(--t3);}
.toc{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r3);padding:var(--s4);margin-bottom:var(--s5);}
.toc-title{font-family:'Orbitron',sans-serif;font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);margin-bottom:var(--s2);}
.toc ol{padding-left:var(--s3);display:flex;flex-direction:column;gap:8px;}
.toc ol li{font-size:14px;color:var(--t2);}
.toc ol li a{color:var(--blue3);transition:color .2s;}.toc ol li a:hover{color:var(--t1);}
.sidebar{position:sticky;top:88px;display:flex;flex-direction:column;gap:var(--s3);}
.sb-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r3);padding:var(--s3);}
.sb-title{font-family:'Orbitron',sans-serif;font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--t3);margin-bottom:var(--s2);}
.sb-links{display:flex;flex-direction:column;gap:8px;}
.sb-link{font-size:13px;color:var(--t2);padding:8px 10px;border-radius:var(--r2);background:var(--bg2);transition:all .2s;display:block;}
.sb-link:hover{color:var(--t1);border-color:rgba(0,87,255,.3);}
.sb-cta{background:linear-gradient(135deg,rgba(0,87,255,.12),rgba(0,180,255,.06));border:1px solid rgba(0,87,255,.25);border-radius:var(--r3);padding:var(--s3);text-align:center;}
.sb-cta h4{font-family:'Geologica',sans-serif;font-weight:700;font-size:16px;color:var(--t1);margin-bottom:8px;line-height:1.35;}
.sb-cta p{font-size:13px;color:var(--t2);margin-bottom:var(--s2);line-height:1.55;}
.sb-cta a{display:block;background:var(--blue);color:#fff;font-family:'Geologica',sans-serif;font-weight:600;font-size:13px;padding:11px;border-radius:var(--r2);text-align:center;transition:all .25s;}
.sb-cta a:hover{background:var(--blue2);color:#fff;transform:translateY(-1px);}
.bottom-cta{background:linear-gradient(135deg,rgba(0,87,255,.08),rgba(0,40,120,.05));border-top:1px solid rgba(0,87,255,.15);border-bottom:1px solid rgba(0,87,255,.15);padding:var(--s6) 0;text-align:center;margin-top:var(--s6);}
.bottom-cta h2{font-family:'Geologica',sans-serif;font-size:clamp(24px,3vw,36px);font-weight:800;margin-bottom:var(--s2);}
.bottom-cta p{color:var(--t2);font-size:16px;max-width:500px;margin:0 auto var(--s4);line-height:1.65;}
.bottom-cta .btns{display:flex;gap:var(--s2);justify-content:center;flex-wrap:wrap;}
.btn-p{display:inline-flex;align-items:center;gap:8px;background:var(--blue);color:#fff;font-family:'Geologica',sans-serif;font-weight:600;font-size:15px;padding:14px 28px;border-radius:var(--r2);transition:all .25s;text-decoration:none;}
.btn-p:hover{background:var(--blue2);color:#fff;transform:translateY(-2px);}
.btn-g{display:inline-flex;align-items:center;gap:8px;background:transparent;color:var(--t2);font-family:'Geologica',sans-serif;font-weight:600;font-size:15px;padding:14px 28px;border-radius:var(--r2);border:1px solid var(--border);transition:all .25s;text-decoration:none;}
.btn-g:hover{color:var(--t1);border-color:rgba(255,255,255,.3);}
.related-section{background:var(--bg2);padding:var(--s6) 0;}
.related-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);max-width:1140px;margin:0 auto;padding:0 var(--s3);}
.related-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r3);padding:var(--s3);transition:all .3s;text-decoration:none;display:block;}
.related-card:hover{border-color:rgba(0,87,255,.3);transform:translateY(-3px);}
.rc-cat{font-family:'Orbitron',sans-serif;font-size:8px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--blue3);margin-bottom:8px;}
.rc-title{font-family:'Geologica',sans-serif;font-weight:700;font-size:15px;color:var(--t1);margin-bottom:6px;line-height:1.35;}
.rc-meta{font-size:12px;color:var(--t3);}
#footer{background:#060608;border-top:1px solid var(--border);padding:var(--s4) 0;}
.footer-inner{max-width:1240px;margin:0 auto;padding:0 var(--s3);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:var(--s2);}
.footer-inner p{font-size:13px;color:var(--t3);}
.footer-links{display:flex;gap:var(--s3);}
.footer-links a{font-size:13px;color:var(--t3);transition:color .2s;}.footer-links a:hover{color:var(--t2);}
@media(max-width:1024px){.sidebar-wrap{grid-template-columns:1fr;}.sidebar{position:relative;top:0;}}
@media(max-width:768px){.nav-links,.btn-demo{display:none;}.mob-nav-toggle{display:block;}.related-grid{grid-template-columns:1fr;}.key-number{flex-direction:column;}.kn-val{font-size:36px;}}
</style>
